<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Changement de carte GE</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#667085;--pri:#0b6bcb;--ok:#14803c;--warn:#b54708;--bd:#d9dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--card:#1a2029;--tx:#eef1f5;--mut:#9aa4b2;--pri:#5aa5f5;--ok:#4cc38a;--warn:#f0a35e;--bd:#2c3542}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 14px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
select,input,textarea,button{font:inherit;color:var(--tx)}
select,input,textarea{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
button{border:0;border-radius:12px;padding:14px 16px;background:var(--pri);color:#fff;font-weight:600;width:100%;margin-top:12px}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.del{background:none;color:var(--warn);border:1px solid var(--bd)}
.row{color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:12px;align-items:center}
.row.done{opacity:.5}
.row input[type=checkbox]{padding:0;width:28px;height:28px;flex:none}
.big{font-size:22px;font-weight:700}
.fn{color:var(--mut);font-size:14px}
.no{border-color:var(--warn)}.no .big{color:var(--warn);font-size:18px}
.note{color:var(--mut);font-size:14px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;margin:0;border-radius:0;background:none;color:var(--mut);padding:16px 4px}
nav button.on{color:var(--pri)}
.t{display:grid;grid-template-columns:70px 1fr;gap:8px;margin:8px 0}
.hide{display:none}
</style>
</head>
<body>
<main>
<section id="v-conv">
<h1>Changer une carte</h1>
<label>Ancienne carte</label><select id="old"></select>
<label>Nouvelle carte</label><select id="new"></select>
<button id="go">Voir le câblage</button>
<div id="res"></div>
</section>

<section id="v-cards" class="hide">
<h1>Mes cartes</h1>
<div id="list"></div>
<button id="add">+ Ajouter une carte</button>
<div id="form" class="hide">
<label>Nom de la carte</label><input id="cn" placeholder="ex. DSE 6020 MKII">
<label>Bornes</label>
<div id="rows"></div>
<button class="sec" id="addrow">+ Ajouter une borne</button>
<button id="save">Enregistrer la carte</button>
<button class="sec" id="cancel">Annuler</button>
</div>
</section>

<section id="v-imp" class="hide">
<h1>Importer / Exporter</h1>
<label>Coller le document de la carte (JSON)</label>
<textarea id="json" rows="8" placeholder='{"modele":"...","bornes":[{"borne":1,"fonction":"DC_PLUS"}]}'></textarea>
<button id="imp">Importer</button>
<label>Ou choisir un fichier .json</label><input type="file" id="file" accept=".json,application/json">
<button class="sec" id="exp">Copier toutes mes cartes</button>
<p class="note" id="msg"></p>
</section>
</main>
<nav>
<button data-v="conv" class="on">Convertir</button>
<button data-v="cards">Cartes</button>
<button data-v="imp">Importer</button>
</nav>
<datalist id="fns"></datalist>
<script>
var FN=["DC_PLUS","DC_MOINS","ARRET_URGENCE","CARBURANT","DEMARREUR","ALTERNATEUR_CHARGE","PRESSION_HUILE","TEMP_EAU","NIVEAU_CARBURANT","CAPTEUR_VITESSE","ENTREE_AUX","SORTIE_AUX","GEN_L1","GEN_L2","GEN_L3","GEN_N","SECTEUR_L1","SECTEUR_L2","SECTEUR_L3","SECTEUR_N","CAN_H","CAN_L","RS485"];
var KEY="ge_cartes_v1",cards=[];
var DEMO=[{id:"demo1",modele:"EXEMPLE ancienne carte (à supprimer)",bornes:[{borne:1,fonction:"DC_MOINS"},{borne:2,fonction:"DC_PLUS"},{borne:3,fonction:"ARRET_URGENCE"},{borne:4,fonction:"CARBURANT"},{borne:5,fonction:"DEMARREUR"}]},{id:"demo2",modele:"EXEMPLE nouvelle carte (à supprimer)",bornes:[{borne:1,fonction:"DC_PLUS"},{borne:2,fonction:"DC_MOINS"},{borne:3,fonction:"DEMARREUR"},{borne:4,fonction:"CARBURANT"},{borne:6,fonction:"CAPTEUR_VITESSE"}]}];
function load(){try{var s=localStorage.getItem(KEY);cards=s?JSON.parse(s):DEMO}catch(e){cards=DEMO}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(cards))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function opts(){var h=cards.map(function(c){return'<option value="'+c.id+'">'+esc(c.modele)+'</option>'}).join("");var a=$("old").value,b=$("new").value;$("old").innerHTML=h;$("new").innerHTML=h;if(find(a))$("old").value=a;if(find(b))$("new").value=b;else if(cards[1])$("new").value=cards[1].id}
function drawList(){$("list").innerHTML=cards.length?cards.map(function(c){return'<div class="row"><div style="flex:1"><div class="big" style="font-size:18px">'+esc(c.modele)+'</div><div class="fn">'+c.bornes.length+' bornes</div></div><button class="del" style="width:auto;margin:0" data-d="'+c.id+'">Suppr.</button></div>'}).join(""):'<p class="note">Aucune carte.</p>'}
function refresh(){opts();drawList()}
function find(id){return cards.filter(function(c){return c.id===id})[0]}
function cmp(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true})}
function nf(x){return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toUpperCase().replace(/\s+/g,"_")}
function group(c){var g={};c.bornes.forEach(function(b){(g[b.fonction]=g[b.fonction]||[]).push(b.borne)});Object.keys(g).forEach(function(k){g[k].sort(cmp)});return g}
$("go").onclick=function(){
var o=find($("old").value),n=find($("new").value),r=$("res");
if(!o||!n){r.innerHTML='<p class="note">Choisis deux cartes.</p>';return}
if(o.id===n.id){r.innerHTML='<p class="note">Choisis deux cartes différentes.</p>';return}
var go=group(o),gn=group(n),out=[],used={};
o.bornes.slice().sort(function(a,b){return cmp(a.borne,b.borne)}).forEach(function(b){
var arr=gn[b.fonction]||[],i=(used[b.fonction]=used[b.fonction]||0);used[b.fonction]++;
var t=arr[i];
if(t===undefined)out.push('<div class="row no"><div><div class="big">Borne '+b.borne+' : pas d’équivalent</div><div class="fn">'+esc(b.fonction)+' — isoler le fil</div></div></div>');
else if(String(t)===String(b.borne))out.push('<label class="row"><input type="checkbox"><div><div class="big">Borne '+b.borne+' : ne change pas</div><div class="fn">'+esc(b.fonction)+'</div></div></label>');
else out.push('<label class="row"><input type="checkbox"><div><div class="big">Borne '+b.borne+' → borne '+t+'</div><div class="fn">'+esc(b.fonction)+'</div></div></label>');
});
var extra=[];Object.keys(gn).forEach(function(f){var u=used[f]||0;gn[f].slice(u).forEach(function(t){extra.push("borne "+t+" ("+f+")")})});
r.innerHTML='<p class="note">Débranche d’abord tous les fils de l’ancienne carte, puis branche chacun sur la borne indiquée de la nouvelle (coche au fur et à mesure).</p>'+out.join("")+(extra.length?'<p class="note">Bornes de la nouvelle carte sans fil de l’ancienne : '+esc(extra.join(", "))+'</p>':"");
r.querySelectorAll("input[type=checkbox]").forEach(function(c){c.onchange=function(){c.closest(".row").classList.toggle("done",c.checked)}});
};
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b)});["conv","cards","imp"].forEach(function(v){$("v-"+v).classList.toggle("hide",v!==b.dataset.v)})}});
$("list").onclick=function(e){var d=e.target.dataset.d;if(d&&confirm("Supprimer cette carte ?")){cards=cards.filter(function(c){return c.id!==d});store();refresh()}};
function row(b,f){var d=document.createElement("div");d.className="t";d.innerHTML='<input placeholder="N°" value="'+esc(b||"")+'"><input list="fns" placeholder="Fonction" value="'+esc(f||"")+'">';$("rows").appendChild(d)}
$("add").onclick=function(){$("form").classList.remove("hide");$("rows").innerHTML="";$("cn").value="";for(var i=0;i<4;i++)row();$("add").classList.add("hide")};
$("cancel").onclick=function(){$("form").classList.add("hide");$("add").classList.remove("hide")};
$("addrow").onclick=function(){row()};
$("save").onclick=function(){var nm=$("cn").value.trim(),bs=[];
$("rows").querySelectorAll(".t").forEach(function(t){var i=t.querySelectorAll("input"),n=i[0].value.trim().toUpperCase(),f=nf(i[1].value);if(n&&f)bs.push({borne:/^\d+$/.test(n)?+n:n,fonction:f})});
if(!nm||!bs.length){alert("Nom et au moins une borne.");return}var seen={};for(var q=0;q<bs.length;q++){var kk=String(bs[q].borne);if(seen[kk]){alert("Borne "+kk+" en double.");return}seen[kk]=1}
cards.push({id:"c"+Date.now(),modele:nm,bornes:bs});store();refresh();$("form").classList.add("hide");$("add").classList.remove("hide")};
function importObj(o){var a=Array.isArray(o)?o:[o],k=0;a.forEach(function(c){if(c&&c.modele&&Array.isArray(c.bornes)){c.id=c.id||"c"+Date.now()+k;cards=cards.filter(function(x){return x.id!==c.id&&x.modele!==c.modele});cards.push({id:c.id,modele:c.modele,bornes:c.bornes.filter(function(b){return b&&b.borne!==undefined&&b.borne!==""&&b.fonction}).map(function(b){var n=String(b.borne).trim();return{borne:/^\d+$/.test(n)?+n:n,fonction:nf(b.fonction)}})});k++}});
if(k){cards=cards.filter(function(c){return c.id.indexOf("demo")!==0});store();refresh()}
$("msg").textContent=k?k+" carte(s) importée(s).":"Format invalide."}
$("imp").onclick=function(){try{importObj(JSON.parse($("json").value));$("json").value=""}catch(e){$("msg").textContent="JSON invalide."}};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{importObj(JSON.parse(r.result))}catch(x){$("msg").textContent="JSON invalide."}};r.readAsText(f)};
$("exp").onclick=function(){var t=JSON.stringify(cards,null,1);try{navigator.clipboard.writeText(t).then(function(){$("msg").textContent="Copié."},function(){$("json").value=t;$("msg").textContent="Texte placé dans la zone ci-dessus."})}catch(e){$("json").value=t;$("msg").textContent="Texte placé ci-dessus."}};
$("fns").innerHTML=FN.map(function(f){return'<option value="'+f+'">'}).join("");
load();refresh();
</script>
</body>
</html>
